name: Arduino Lint

# 公式の arduino/arduino-lint-action を使い、Library Manager 登録済みライブラリの
# 更新時ルール (--library-manager update 相当) でリポジトリを自動検証する。
# 注: v0.1.0 で Library Manager に登録済みのため、submit ではなく update を使用。
# https://github.com/arduino/arduino-lint-action

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  # 必要に応じて手動実行も可能にする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v2
        with:
          # Library Manager 登録済みライブラリの更新時ルールで検証
          compliance: specification
          library-manager: update
          # 警告も含めて表示
          report-file: arduino-lint-report.json
          # プロジェクトタイプを明示 (リポジトリ全体を1つのライブラリとして扱う)
          project-type: library

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-lint-report
          path: arduino-lint-report.json
          retention-days: 30
