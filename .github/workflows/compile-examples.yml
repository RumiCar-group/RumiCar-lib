name: Compile Examples

# すべてのスケッチ例を、ハンズオンで使う Arduino Nano の 2 つの設定でコンパイルする。
# Type-C 端子の CM = ATmega328P (atmega328)、Mini-USB 端子の CM = Old Bootloader (atmega328old)。
# どちらも同じ AVR コードなのでビルド結果は同じだが、FQBN が有効であることも合わせて確かめる。
#
# arduino-cli を直接使う (Arduino IDE 2 が内部で使っているのと同じツール)。
# 以前使っていた arduino/compile-sketches@v1 は Python 3.12.4 を固定で要求し、
# ubuntu-latest が 26.04 になった 2026-11 以降は setup-python が
# "The version '3.12.4' ... was not found for Ubuntu 26.04" で失敗するため置き換えた。

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:nano:cpu=atmega328
          - arduino:avr:nano:cpu=atmega328old

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the AVR core and the VL53L0X library
        run: |
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install VL53L0X

      # --library . でこのリポジトリのライブラリを使う (Library Manager の版ではなく、この commit)。
      - name: Compile all examples
        run: |
          set -e
          for sketch in examples/*/; do
            echo "::group::${sketch}"
            arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . --warnings all "${sketch}"
            echo "::endgroup::"
          done
